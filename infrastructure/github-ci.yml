name: ROXSTAR Automated CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: roxstar
          POSTGRES_PASSWORD: roxstar_password
          POSTGRES_DB: roxstar_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Automated Test Suite
        env:
          DATABASE_URL: postgresql://roxstar:roxstar_password@localhost:5432/roxstar_db
          NODE_ENV: test
        run: |
          cd backend
          npm test

      - name: Build & Verify Docker Image
        run: |
          docker build -f infrastructure/Dockerfile -t roxstar-backend:latest .

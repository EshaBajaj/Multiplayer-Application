services:
  # ==========================================
  # ROXSTAR Node.js & WebSocket Backend Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: roxstar-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://neondb_owner:npg_2alIkCDe3OcZ@ep-tiny-art-b5pp65kt-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require
      - DB_SSL=true
      - CORS_ORIGIN=*
      - LOG_LEVEL=info
    volumes:
      - uploads_data:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    networks:
      - roxstar-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Local PostgreSQL Database Service (Optional)
  # (Can be overridden by specifying external Neon DATABASE_URL in .env)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: roxstar-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=roxstar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - roxstar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roxstar_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  roxstar-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
